# Vergabemarktplätze der Länder — Quellenliste für den unterschwelligen Kanal
#
# Erhoben am 21.08.2026 durch direkten Abruf der Plattformen (Softwarekennung über
# Pfadsignatur und Seiteninhalt) und eine Vollsuche auf GovData, dem Katalog, in
# dem Bund und Länder ihre offenen Daten führen.
#
# 🔑 DER BEFUND, der den Zuschnitt bestimmt:
#    Die Landschaft ist **anbieterkonzentriert, nicht länderkonzentriert.**
#    Drei Softwarefamilien decken praktisch alles ab. Damit ist die Frage nach
#    einer Schnittstelle keine 16-fache, sondern eine 3-fache — und für eine der
#    drei ist der Mechanismus bereits dokumentiert.
#
# Legende status:
#   offen      = Daten sind heute abrufbar, ohne Rückfrage
#   schalter   = Mechanismus dokumentiert, nur nicht freigeschaltet → Anfrage an
#                die Verfahrensbetreuung der jeweiligen Installation
#   unbekannt  = keine öffentliche Schnittstelle gefunden; ob eine existiert, ist
#                eine Frage an den Anbieter. "Nicht gefunden" ist nicht "gibt es nicht".
#   im_bund    = läuft bereits über den Datenservice, braucht keinen eigenen Kanal

# --- HEUTE ABRUFBAR ---------------------------------------------------------
# Sieben Endpunkte, alle unter Datenlizenz Deutschland Zero 2.0 (gemeinfrei,
# gewerblich nutzbar, ohne Namensnennung). Tägliches ZIP, EU + national.
# ⚠ Das Archiv wird nachts überschrieben — eine Historie entsteht erst ab dem
#   Tag, an dem der Abruf läuft. Deshalb ist "später anschließen" nicht gratis.
