# --- EIN SCHALTER FEHLT, SONST NICHTS ---------------------------------------
# cosinex-Installationen ohne konfigurierte Zugriffs-ID. Der Mechanismus steht in
# cosinex' eigener Produktdoku: "Die ID muss von der jeweiligen Verfahrens-
# betreuung der Installation konfiguriert werden." Also eine Anfrage, kein Bau.
  - land: Brandenburg
    name: Vergabemarktplatz Brandenburg
    software: cosinex
    status: schalter
    basis: "https://vergabemarktplatz.brandenburg.de"
    hinweis: >
      robots.txt sagt "Disallow: /" für alle Agenten — die Plattform wird deshalb
      nicht abgerufen. Der Open-Data-Weg ist der einzige saubere; dafür müsste die
      Verfahrensbetreuung die Zugriffs-ID freischalten.

  - land: Rheinland-Pfalz
    name: Vergabemarktplatz Rheinland-Pfalz
    software: cosinex
    status: schalter
    basis: "https://www.vergabe.rlp.de"
    hinweis: >
      Am 21.08. neu gefunden: dieselbe Software wie NRW und Brandenburg
      (VMPCenter/VMPSatellite). /VMPSatellite/opendata leitet ohne ID auf die
      Startseite um — der Endpunkt existiert, die ID ist nicht vergeben.

  - land: überregional
    name: Deutsches Vergabeportal (DTVP)
    software: cosinex
    status: schalter
    basis: "https://www.dtvp.de"
    hinweis: >
      Kein Land, sondern cosinex' eigenes gehostetes Portal, das viele
      Vergabestellen quer über die Länder nutzen. Wenn irgendwo ein einzelner
      Schalter viel bewegt, dann hier — der Adressat wäre cosinex selbst.

# --- ANBIETER UNBEKANNT VERMESSEN, SCHNITTSTELLE NICHT GEFUNDEN -------------
# Für keine dieser Plattformen liegt ein Datensatz auf GovData, und keine
# dokumentiert öffentlich eine Open-Data-Schnittstelle. Das ist ein "nicht
# gefunden", kein "existiert nicht" — die Frage geht an den Anbieter, und weil
# sich die Anbieter wiederholen, sind es wenige Fragen.
  - land: Berlin
    name: Vergabeplattform des Landes Berlin
    software: RIB Software (RIB Tender / meinauftrag.rib.de)
