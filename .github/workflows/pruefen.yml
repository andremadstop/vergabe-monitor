# Dieselben Prüfungen wie lokal (pruefen.sh), bei jedem Push und Pull Request und wöchentlich,
# damit neu bekannt gewordene Lücken in den Abhängigkeiten auch ohne Codeänderung auffallen.
# Actions sind auf Commit-Hashes festgeschrieben, nicht auf verschiebbare Tags.
name: pruefen
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Prüfungen
        run: ./pruefen.sh
